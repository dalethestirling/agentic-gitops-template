apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "demoapp.fullname" . }}
  labels:
    {{- include "demoapp.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.ingress.host | default "demoapp.local" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "demoapp.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
